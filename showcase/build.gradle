// Development only. This mod is never released and is in neither product jar: it exists to look at the shared
// components in a real game window.
//
//   gradlew :showcase:runClient                 opens the gallery on the title screen
//   gradlew :showcase:runClient -Pcapture       also saves screenshots to showcase/run/screenshots and quits
base {
    archivesName = 'shardclient-showcase'
}

dependencies {
    implementation project(':shared')
}

loom {
    runs {
        client {
            if (project.hasProperty('capture')) {
                property 'shardclient.showcase.capture', 'true'
            }
        }
    }
}
