base {
    archivesName = 'shardclient-showcase'
}

dependencies {
    implementation project(':shared')

    implementation project(':full')
}

loom {
    runs {
        client {
            if (project.hasProperty('capture')) {
                property 'shardclient.showcase.capture', 'true'
            }
            if (project.hasProperty('render')) {
                property 'shardclient.showcase.render', 'true'
                programArgs '--width', '1920', '--height', '1080'
            }
            if (project.hasProperty('featurecheck')) {
                property 'shardclient.showcase.check', 'true'
                programArgs '--width', '1920', '--height', '1080'
            }
            if (project.hasProperty('skycheck')) {
                property 'shardclient.showcase.sky', 'true'
                programArgs '--width', '1280', '--height', '720'
            }
            if (project.hasProperty('menus')) {
                property 'shardclient.showcase.menus', 'true'
            }
        }
    }
}
