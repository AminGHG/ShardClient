base {
    archivesName = 'shardclient-showcase'
}

dependencies {
    implementation project(':shared')

    implementation project(':full')
}

loom {
    runs {
        client {
            if (project.hasProperty('capture')) {
                property 'shardclient.showcase.capture', 'true'
            }
            if (project.hasProperty('menus')) {
                property 'shardclient.showcase.menus', 'true'
            }
        }
    }
}
